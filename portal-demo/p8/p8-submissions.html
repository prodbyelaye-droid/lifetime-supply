<!doctype html>
<html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>submissions from the portal demo</title>
<style>html,body{margin:0;background:#f8f8fa;overflow:hidden}img{display:block;position:absolute;top:0}.side{display:none}.body{left:0;width:100%;height:auto}html[data-theme=dark],html[data-theme=dark] body{background:#090a0c}</style>
</head><body>
<img class="side" src="../../assets/l4-portal/submissions-light-side@2x.webp" alt="">
<img class="body" src="../../assets/l4-portal/submissions-light-body@2x.webp" alt="three submissions: new, in review, and sent to artist with feedback. names and feedback blurred.">
<script>
// Reuse the exact submissions state already shown in the interactive demo.
const theme = new URLSearchParams(location.search).get('t') === 'dark' ? 'dark' : 'light';
document.documentElement.dataset.theme = theme;
for (const img of document.images) img.src = img.src.replace('-light-', '-' + theme + '-');
</script>
</body></html>
